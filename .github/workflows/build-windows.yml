name: Build Windows

on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installa dipendenze
        run: npm ci

      - name: Test
        run: npm test

      - name: Crea installer e versione portatile
        run: npx electron-builder --win --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Carica gli .exe come artifact
        uses: actions/upload-artifact@v4
        with:
          name: ReadbackCopilot-Windows
          path: dist/*.exe
          if-no-files-found: error

      - name: Pubblica nella pagina Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Readback Copilot – build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: dist/*.exe
          body: |
            **Come installare (Windows 10/11, 64 bit)**
            - `ReadbackCopilot-Setup-*.exe`: installer con collegamento sul desktop.
            - `ReadbackCopilot-Portable-*.exe`: si avvia senza installazione.

            Il programma non è firmato digitalmente: se compare "Windows ha protetto il PC" clicca **Ulteriori informazioni → Esegui comunque**.

            Commit: ${{ github.sha }} (ramo `${{ github.ref_name }}`)
